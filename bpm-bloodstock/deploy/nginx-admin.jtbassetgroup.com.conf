# Nginx reverse proxy for admin.jtbassetgroup.com -> Next.js on 127.0.0.1:3000
#
# On the Onidel panel you normally do NOT paste this whole file — the panel
# owns the server{} block and the Let's Encrypt SSL config. Instead:
#   • Create a new site "admin.jtbassetgroup.com" in the panel (with SSL), then
#   • use the panel's "Reverse Proxy" feature, OR paste just the `location /`
#     block below into the site's custom/advanced Nginx config.
#
# This standalone block is provided for reference / manual (non-panel) setups.

server {
    listen 80;
    server_name admin.jtbassetgroup.com;
    # Let the panel/Certbot handle the HTTP->HTTPS redirect + ACME challenge.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name admin.jtbassetgroup.com;

    # --- SSL: managed by the Onidel panel / Let's Encrypt ---
    # ssl_certificate     /etc/letsencrypt/live/admin.jtbassetgroup.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/admin.jtbassetgroup.com/privkey.pem;

    # Allow Stripe webhooks / uploads a little headroom.
    client_max_body_size 10m;

    # ---- The important part: proxy everything to the Node app ----
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # WebSocket / HMR upgrade headers (harmless in prod).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }

    # Next.js static assets are served by the Node process; if you want Nginx to
    # cache them, uncomment:
    # location /_next/static/ {
    #     proxy_pass http://127.0.0.1:3000;
    #     proxy_cache_valid 200 60m;
    #     add_header Cache-Control "public, max-age=31536000, immutable";
    # }
}
