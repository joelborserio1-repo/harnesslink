# Harnesslink staging stack: Postgres + Rails API + Next.js public site.
#
#   cp .env.example .env    # then set SECRET_KEY_BASE and DB_PASSWORD
#   docker compose up -d --build
#
# The site is served on http://<host>:${WEB_PORT:-8080}. Put Cloudflare or the
# host's nginx in front for TLS and the real domain. See DEPLOY.md.

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: harnesslink
      POSTGRES_PASSWORD: ${DB_PASSWORD:-harnesslink}
      POSTGRES_DB: harnesslink_production
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harnesslink -d harnesslink_production"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./api
    restart: unless-stopped
    # Exposed so the internal admin (Avo at /avo) is reachable in the browser,
    # e.g. http://<host>:3001/avo. The public site still talks to it privately.
    ports:
      - "${ADMIN_PORT:-3001}:80"
    environment:
      RAILS_ENV: production
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?set SECRET_KEY_BASE in .env}
      DATABASE_URL: postgres://harnesslink:${DB_PASSWORD:-harnesslink}@db:5432/harnesslink_production
      RAILS_LOG_TO_STDOUT: "1"
      RAILS_MAX_THREADS: "5"
      # Seeds the first admin account (portal + Avo). Staff sign in per person.
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@harnesslink.com}
      ADMIN_HOST: ${ADMIN_HOST:-localhost}
      # Publish → social webhook (Zapier / Make / Ayrshare). Empty = disabled.
      SOCIAL_WEBHOOK_URL: ${SOCIAL_WEBHOOK_URL:-}
      # Responsive images via imgproxy. Leave IMGPROXY_URL empty to serve
      # originals; set it to the PUBLIC imgproxy URL (browser-reachable) to
      # enable WebP/AVIF resizing. Keys optional (blank = insecure signatures).
      IMGPROXY_URL: ${IMGPROXY_URL:-}
      IMGPROXY_KEY: ${IMGPROXY_KEY:-}
      IMGPROXY_SALT: ${IMGPROXY_SALT:-}
      # RAILS_FORCE_SSL: "true"   # enable once TLS terminates upstream
    depends_on:
      db:
        condition: service_healthy
    # The entrypoint runs `db:prepare` (migrate + seed the 20 demo articles on
    # first boot); Thruster serves the API on port 80 inside the network.

  # Strapi CMS — articles, writers, sections, pages, ads, redirects. Its
  # admin panel is where the newsroom works. Secrets live in cms/.env (see
  # cms/.env.example); database settings come from here.
  cms:
    build:
      context: ./cms
      args:
        PUBLIC_URL: ${CMS_PUBLIC_URL:-}
        # Must match the sub-folder the admin is served under (staging: /cms/admin).
        ADMIN_COOKIE_PATH: ${CMS_ADMIN_COOKIE_PATH:-/admin}
    restart: unless-stopped
    env_file: ./cms/.env
    environment:
      NODE_ENV: production
      PUBLIC_URL: ${CMS_PUBLIC_URL:-}
      IS_PROXIED: "true"
      ADMIN_COOKIE_PATH: ${CMS_ADMIN_COOKIE_PATH:-/admin}
      DATABASE_CLIENT: postgres
      DATABASE_HOST: db
      DATABASE_PORT: "5432"
      DATABASE_NAME: harnesslink_cms
      DATABASE_USERNAME: harnesslink
      DATABASE_PASSWORD: ${DB_PASSWORD:-harnesslink}
      STRAPI_TELEMETRY_DISABLED: "true"
    volumes:
      - cms_uploads:/app/public/uploads
    ports:
      # Local only: nginx proxies the public /cms/ path to it.
      - "127.0.0.1:${CMS_PORT:-1337}:1337"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./web
      args:
        STRAPI_URL: http://cms:1337
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_BASE: http://api        # directory (Rails) until it moves to Strapi
      STRAPI_URL: http://cms:1337 # server-to-server, inside the compose network
      STRAPI_PUBLIC_URL: ${CMS_PUBLIC_URL:-} # where browsers load CMS media from
      # "true" on staging so search engines never index it. MUST be unset in production.
      NOINDEX: ${NOINDEX:-}
    depends_on:
      - api
      - cms
    ports:
      - "${WEB_PORT:-8080}:3000"

  # On-the-fly image resizing → WebP/AVIF. Point IMGPROXY_URL (above) at this
  # service's public address to activate it. It fetches the originals (the
  # WordPress uploads during transition, object storage later).
  imgproxy:
    image: darthsim/imgproxy:latest
    restart: unless-stopped
    environment:
      IMGPROXY_ENABLE_WEBP_DETECTION: "true"
      IMGPROXY_ENABLE_AVIF_DETECTION: "true"
      IMGPROXY_KEY: ${IMGPROXY_KEY:-}
      IMGPROXY_SALT: ${IMGPROXY_SALT:-}
      IMGPROXY_ALLOWED_SOURCES: "https://harnesslink.com/,https://staging.harnesslink.com/"
    ports:
      - "${IMGPROXY_PORT:-8081}:8080"

volumes:
  pgdata:
  cms_uploads:
